<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="description" content="藤枝明誠スクールバスの下校便予定を、カレンダーから確認できる非公式Webアプリです。">
  <title>スクールバス 時刻表</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=ios17">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">FUJIEDA MEISEI</p>
        <h1>スクールバス 時刻表</h1>
      </div>
    </header>

    <main>
      <section class="notice hidden" id="dataNotice" role="status"></section>
      <section id="monthView" class="panel" aria-label="運行カレンダー">
        <div class="month-head">
          <button class="month-nav" id="prevMonth" aria-label="前の月">‹</button>
          <h3 id="monthLabel"></h3>
          <button class="month-nav" id="nextMonth" aria-label="次の月">›</button>
        </div>
        <div class="weekdays" aria-hidden="true">
          <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span>
        </div>
        <div id="calendar" class="calendar"></div>
        <div class="legend">
          <span><i class="dot mode-a"></i>A便</span>
          <span><i class="dot mode-b"></i>B便</span>
          <span><i class="dot mode-c"></i>C便</span>
          <span><i class="dot mode-d"></i>D便</span>
          <span><i class="change-icon"></i>変更あり</span>
          <span><i class="dot none"></i>運休</span>
          <span><i class="dot unknown"></i>未確認</span>
        </div>
      </section>

      <section class="hero-card schedule-card" id="heroCard">
        <div class="hero-head">
          <div>
            <p class="date-caption" id="heroDate"></p>
            <h2 id="heroTitle">読み込み中…</h2>
          </div>
          <span class="status-pill" id="heroStatus">確認中</span>
        </div>
        <div id="heroDetails" class="hero-details"></div>
        <a id="sourceLink" class="source-link hidden" target="_blank" rel="noopener">公式PDFを確認する ↗</a>
        <div id="scheduleTable"></div>
      </section>

    </main>
  </div>
  <script src="./app-v24.js?v=ios17" defer></script>
</body>
</html>
