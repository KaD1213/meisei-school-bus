name: Update school bus data

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours. GitHub cron is UTC.
    - cron: "17 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install parser dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest official schedule
        run: python scripts/update.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/schedule.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "meisei-bus-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git commit -m "Update school bus schedule"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
